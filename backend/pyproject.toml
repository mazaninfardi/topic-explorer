[project]
name = "topic-explorer-backend"
version = "0.1.0"
description = "Topic Explorer BFF: arXiv ingestion + Gemini (Vertex) extraction."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "pyjwt>=2.14.0",
    "google-auth>=2.0",
    "cloud-sql-python-connector[asyncpg]>=1.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
